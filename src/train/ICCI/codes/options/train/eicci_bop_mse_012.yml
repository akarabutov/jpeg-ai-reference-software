#### general settings training
name: eicci_bop_mse_012
use_tb_logger: true
model: sr
distortion: sr
scale: 1
gpu_ids: [0, 1]
dataflow: true #Faster dataload for HDD

#### datasets
datasets:
  train:
    name: eicci_bop_012
    mode: LQGT
    dataroot_GT: ../dataset/lmdb/bop_org.lmdb
    dataroot_LQ: ../dataset/lmdb/bop_012.lmdb

    use_shuffle: true
    n_workers: 4
    batch_size: 64
    GT_size: 192
    use_flip: false
    use_rot: false
    color: gray
    YUV: 444
  val:
    name: val_bop_012
    mode: LQGT
    YUV: 444
    dataroot_GT: ../dataset/val/bop_org
    dataroot_LQ: ../dataset/val/bop_012

#### network structures
network_G:
  which_model_G: ThreeStageYUVLite_DWT2_444_jointUV
  in_nc: 1
  out_nc: 1
  nf: 48
  nb: 2
  nbUV: 4
  upscale: 1

#### path, ~ means start from scratch, otherwise enter path of the model and state to resume training from
path:
  pretrain_model_G: ~ # ../experiments/eICCI_bop_mse_012/models/100000_G.pth
  strict_load: true
  resume_state: ~ # ../experiments/eICCI_bop_mse_012/training_state/100000.state

#### training settings: learning rate scheme, loss
train:
  lr_G: !!float 1e-4
  lr_scheme: MultiStepLR
  beta1: 0.9
  beta2: 0.99
  niter: 300000
  warmup_iter: -1 # no warm up
  lr_steps:
    [100000, 200000, 300000, 400000, 500000, 600000, 700000, 800000, 900000]
  lr_gamma: 0.25
  #T_period: [250000, 250000, 250000, 250000]
  #restarts: [250000, 500000, 750000]
  #restart_weights: [1, 1, 1]
  eta_min: !!float 1e-7

  pixel_criterion: l2
  pixel_weight: [6.0, 1.0, 1.0]

  manual_seed: 100
  val_freq: !!float 2e3

#### logger
logger:
  print_freq: 10
  save_checkpoint_freq: !!float 1e3
