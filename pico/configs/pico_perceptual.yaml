# Phase 2: perceptual fine-tuning (Sec. 4.2, App. C).  Start from phase 1:
#   python train.py -c configs/pico_perceptual.yaml --init runs/mse/checkpoints/last.ckpt --out runs/perc
# Values marked "paper" come from arXiv:2605.05148; everything else is our
# choice because the paper does not specify it.

model: {}

data:
  train: [/path/to/train_images]
  val: null
  mask_root: null      # precomputed CRAFT text masks (scripts/make_text_masks.py)
  crop_size: 256
  batch_size: 8
  num_workers: 8
  random_downscale: true
  val_crop: 512          # validation: centre crop (multiple of 64)
  val_max_images: 24

train:
  seed: 0
  steps: 500000
  lr: 1.0e-4                      # initial lr of phase 2 is not given in the paper
  lr_milestones: [0.3, 0.6, 0.8]  # paper
  lr_factors: [0.5, 0.3, 0.1]     # paper
  aux_lr: 1.0e-3
  grad_clip: 1.0
  # Lightning Trainer
  accelerator: auto
  devices: 1
  strategy: auto          # multi-GPU: ddp_find_unused_parameters_true
  precision: 32-true      # or bf16-mixed (fp16 is not supported)
  log_every: 100          # TensorBoard scalars, iterations
  progress_every: 20
  val_every: 10000        # iterations
  val_levels: [0.0, 3.5, 7.0]
  val_log_images: 4       # images written to TensorBoard per validation
  ckpt_every: 10000       # iterations

loss:
  phase: perceptual
  alphas: [1, 1, 1, 1, 1, 1, 1, 1]
  w_lpips: 0.0066        # w1
  w_msssim: 0.0066       # w2
  w_tiling: 0.02         # w3  TilingArtifactLoss
  w_text: 0.1            # w4  TextFidelityLoss (needs data.mask_root)
  w_gan: 0.001           # w5  final GAN weight
  # GAN schedule for the codec: no adversarial gradient for gan_start_step
  # iterations (the discriminator already trains -> head start), then the
  # weight ramps linearly 0 -> w_gan over gan_warmup_steps (paper: "gradually
  # increasing the weight of discriminator supervision").
  gan_start_step: 5000
  gan_warmup_steps: 20000
  tal_factors: [2, 4, 8, 16, 32]
  lpips_net: vgg

disc:
  lr: 1.0e-4              # decayed with the same milestones as the codec
  betas: [0.5, 0.999]
  loss: ns                # ns (non-saturating) | hinge
  r1_gamma: 0.0           # R1 penalty on real images (0 = off); e.g. 1.0 if D diverges
  r1_every: 16            # lazy R1: every N iterations, scaled by N
  arch:                   # "PatchGAN with more channels and conv layers"
    base_channels: 128
    num_layers: 4
    max_channels: 1024
    extra_layers: 1
    use_spectral_norm: true
